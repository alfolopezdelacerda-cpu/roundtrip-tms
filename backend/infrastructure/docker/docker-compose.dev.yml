version: "3.9"

# Stack de desarrollo de Roundtrip TMS.
# Levantar desde backend/:
#   docker-compose -f infrastructure/docker/docker-compose.dev.yml up -d

services:
  postgres-transportes:
    image: postgres:16-alpine
    container_name: roundtrip-postgres-transportes
    environment:
      POSTGRES_DB: transportes_db
      POSTGRES_USER: ${POSTGRES_USER:-roundtrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.local}
    ports:
      - "5432:5432"
    volumes:
      - pg-transportes:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roundtrip} -d transportes_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-forwarding:
    image: postgres:16-alpine
    container_name: roundtrip-postgres-forwarding
    environment:
      POSTGRES_DB: forwarding_db
      POSTGRES_USER: ${POSTGRES_USER:-roundtrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.local}
    ports:
      - "5433:5432"
    volumes:
      - pg-forwarding:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roundtrip} -d forwarding_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-monitoreo:
    image: postgres:16-alpine
    container_name: roundtrip-postgres-monitoreo
    environment:
      POSTGRES_DB: monitoreo_db
      POSTGRES_USER: ${POSTGRES_USER:-roundtrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.local}
    ports:
      - "5434:5432"
    volumes:
      - pg-monitoreo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roundtrip} -d monitoreo_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: roundtrip-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?define REDIS_PASSWORD en .env.local}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: roundtrip-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:?define KEYCLOAK_PASSWORD en .env.local}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: roundtrip-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: roundtrip-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  pg-transportes:
  pg-forwarding:
  pg-monitoreo:
  es-data:
